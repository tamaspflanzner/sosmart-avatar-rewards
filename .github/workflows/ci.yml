name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: sosmart-ci
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psosmart-ci --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: sosmart-ci
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
            web/package-lock.json
            simulator/package-lock.json
            contracts/package-lock.json
      - name: Install exact dependencies
        run: |
          npm ci
          npm run install:all
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Lint (no warnings)
        run: npm run lint
      - name: API unit and contract tests
        run: npm test
      - name: MySQL integration tests
        run: npm run test:integration
      - name: Production builds and browser reward/purchase flow
        run: npm run test:e2e
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-diagnostics
          path: |
            test-results/*.log
            test-results/*.png
            test-results/browser-errors.json
          retention-days: 7
